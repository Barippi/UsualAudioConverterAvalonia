name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: win-x64
            runner: windows-latest
            artifact_name: UsualAudioConverter-win-x64.exe
            output_binary: UsualAudioConverter.exe
          - os: linux-x64
            runner: ubuntu-latest
            artifact_name: UsualAudioConverter-linux-x64
            output_binary: UsualAudioConverter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file binary
        run: >
          dotnet publish -c Release -r ${{ matrix.target.os }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Rename binary for release asset
        shell: bash
        run: |
          mv "./publish/${{ matrix.target.output_binary }}" "./publish/${{ matrix.target.artifact_name }}"

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ./publish/${{ matrix.target.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/UsualAudioConverter-win-x64.exe
            ./release-assets/UsualAudioConverter-linux-x64
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
